[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-native-model"
version = "0.5.2"
description = "A graph-native MLX coding runtime with Qwen hidden-state policy fusion, durable Git workspaces, M5 qualification, and held-out graph optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Philip John Basile" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]
mlx = [
  "mlx>=0.31,<1; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.31.3,<1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
restate = [
  "restate_sdk[serde]>=1.0.4,<2",
  "hypercorn>=0.17,<1",
]

[project.scripts]
graph-model = "graph_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graph_model = ["graphs/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
