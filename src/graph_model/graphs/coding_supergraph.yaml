name: coding-supergraph
version: 0.1.0
description: >-
  A validated coding-agent supergraph. The router activates a fast direct path or a deeper
  plan-and-check path. Failures enter a bounded diagnose-repair cycle rather than an open-ended loop.
start: intake
terminals: [finish, abort]
metadata:
  policy: select-first-local-repair
  graph_plasticity: bounded
  optimizer: offline-mcts-compatible

nodes:
  intake:
    kind: router
    operator: route_task
    description: Select a validated route from task features and constraints.

  context:
    kind: tool
    operator: collect_context
    description: Build explicit, inspectable task state.

  plan:
    kind: llm
    operator: make_plan
    description: Produce a typed plan for deep and repair routes.

  plan_check:
    kind: verifier
    operator: check_plan
    description: Reject empty or invalid plans before execution.

  implement:
    kind: llm
    operator: implement
    description: Produce a candidate result; cannot declare its own verification success.

  tests:
    kind: verifier
    operator: run_tests
    description: Run deterministic checks before semantic review.
    side_effect: true

  review:
    kind: llm
    operator: review
    description: Independent semantic review after deterministic checks pass.

  diagnose:
    kind: tool
    operator: diagnose
    description: Convert verifier evidence into targeted repair guidance.

  repair:
    kind: tool
    operator: repair
    description: Apply a bounded local repair without restarting successful upstream work.

  finish:
    kind: final
    operator: finalize
    description: Return the verified result and its evidence.

  abort:
    kind: final
    operator: abort
    description: Stop explicitly when bounded repair paths are exhausted.

edges:
  - from: intake
    to: context
    priority: 100

  - from: context
    to: implement
    when: data.route == 'fast'
    priority: 100
    label: fast-path

  - from: context
    to: plan
    when: data.route in {'deep', 'repair'}
    priority: 90
    label: planned-path

  - from: plan
    to: plan_check
    priority: 100
    max_traversals: 2

  - from: plan_check
    to: implement
    when: data.verdict == 'pass'
    priority: 100

  - from: plan_check
    to: plan
    when: data.verdict == 'fail' and data.plan_revision_count < 2
    priority: 90
    max_traversals: 1
    label: revise-plan

  - from: plan_check
    to: abort
    when: data.verdict == 'fail' and data.plan_revision_count >= 2
    priority: 80

  - from: implement
    to: tests
    priority: 100

  - from: tests
    to: review
    when: data.verdict == 'pass'
    priority: 100
    max_traversals: 3

  - from: tests
    to: diagnose
    when: data.verdict == 'fail' and data.repair_count < 2
    priority: 90
    max_traversals: 2
    label: test-repair

  - from: tests
    to: abort
    when: data.verdict == 'fail' and data.repair_count >= 2
    priority: 80

  - from: review
    to: finish
    when: data.verdict == 'pass'
    priority: 100

  - from: review
    to: diagnose
    when: data.verdict == 'fail' and data.repair_count < 2
    priority: 90
    max_traversals: 2
    label: review-repair

  - from: review
    to: abort
    when: data.verdict == 'fail' and data.repair_count >= 2
    priority: 80

  - from: diagnose
    to: repair
    priority: 100
    max_traversals: 2

  - from: repair
    to: tests
    priority: 100
    max_traversals: 2
